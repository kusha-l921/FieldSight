[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldsight-lite"
version = "1.0.0"
description = "Illumination-Robust, Training-Free Plant Disease Severity and Progression Monitoring on Edge Devices"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "plotly>=5.14.0",
    "streamlit>=1.25.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "pytest>=7.3.0",
    "psutil>=5.9.0",
    "rich>=13.4.0",
    "tabulate>=0.9.0",
]

[project.scripts]
fieldsight = "cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
